              items:
                $ref: '#/components/schemas/Product'
        latest_orders:
          type: array
          items:
            $ref: '#/components/schemas/OrderSummary'
        upcoming_deliveries:
          type: array
          items:
            $ref: '#/components/schemas/UpcomingDelivery'
    SalesReport:
