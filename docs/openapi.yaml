    get:
      tags: [Admin - Catalog]
      summary: List products (any status)
      operationId: adminListProducts
      x-required-permission: products
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
            maxLength: 100
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/ProductStatus'
        - name: grandma_id
          in: query
          required: false
          schema:
