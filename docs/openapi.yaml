          $ref: '#/components/schemas/Timestamp'
        updated_at:
          $ref: '#/components/schemas/Timestamp'
    OrderSummaryPage:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/OrderSummary'
        meta:
          $ref: '#/components/schemas/PageMeta'
    Order:
      allOf:
        - $ref: '#/components/schemas/OrderSummary'
        - type: object
          required: [items, subtotal, fee_amount, can_cancel, timeline, refunds, payment_transactions]
          properties:
            items:
              type: array
              minItems: 1
              items:
                $ref: '#/components/schemas/OrderItem'
            payment_method:
              allOf:
                - $ref: '#/components/schemas/PaymentMethod'
              nullable: true
            address:
              allOf:
                - $ref: '#/components/schemas/Address'
              nullable: true
              description: The address used. It may be soft-deleted (has `deleted_at`). It is kept for history (ERD v2).
            delivery_period:
              allOf:
                - $ref: '#/components/schemas/DeliveryPeriod'
              nullable: true
            prepare_start_date:
              type: string
              format: date
              nullable: true
            subtotal:
              $ref: '#/components/schemas/Money'
            fee_amount:
              $ref: '#/components/schemas/Money'
            customer_notes:
              type: string
              nullable: true
            delivery_responsible_note:
              type: string
              nullable: true
              description: Admin only.
            reject_reason:
              type: string
              nullable: true
            cancel_reason:
              type: string
              nullable: true
            can_cancel:
              type: boolean
              readOnly: true
            cancel_deadline:
              type: string
              format: date-time
              nullable: true
              readOnly: true
            shipping:
              allOf:
                - $ref: '#/components/schemas/OrderShippingDetail'
              nullable: true
            event:
              allOf:
                - $ref: '#/components/schemas/OrderEventDetail'
              nullable: true
            gift:
              allOf:
                - $ref: '#/components/schemas/OrderGiftDetail'
              nullable: true
            timeline:
              type: array
              items:
                $ref: '#/components/schemas/OrderStatusHistory'
            payment_transactions:
              type: array
              items:
                $ref: '#/components/schemas/PaymentTransaction'
            refunds:
              type: array
              items:
                $ref: '#/components/schemas/Refund'
