        comment:
          type: string
          nullable: true
        created_at:
          $ref: '#/components/schemas/Timestamp'
        updated_at:
          $ref: '#/components/schemas/Timestamp'
    ReviewInput:
      type: object
      additionalProperties: false
      required: [rating]
      properties:
        rating:
          type: integer
          minimum: 1
        comment:
          type: string
          maxLength: 2000

    # ------------------------------------------------------------- subscriptions
    SubscriptionPlan:
      type: object
      required: [id, grandma, plan_type, name, price, duration_days, deliveries_count, availability_status]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        grandma:
          $ref: '#/components/schemas/GrandmaRef'
        season_id:
          allOf:
            - $ref: '#/components/schemas/Id'
          nullable: true
        box:
          allOf:
            - $ref: '#/components/schemas/Product'
          nullable: true
          description: The plan's box product (`box_id`). Whether plans have their own contents is still open (A-02).
        plan_type:
          $ref: '#/components/schemas/PlanType'
        name:
          type: string
        image_url:
          type: string
          format: uri
          nullable: true
        price:
          allOf:
            - $ref: '#/components/schemas/Money'
          description: Boxes only, excluding delivery fees (ERD v2).
        duration_days:
          type: integer
          minimum: 1
        deliveries_count:
          type: integer
          minimum: 1
        availability_status:
          $ref: '#/components/schemas/PlanAvailabilityStatus'
        created_at:
          $ref: '#/components/schemas/Timestamp'
        updated_at:
          $ref: '#/components/schemas/Timestamp'
    SubscriptionPlanPage:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/SubscriptionPlan'
        meta:
          $ref: '#/components/schemas/PageMeta'
    SubscriptionPlanInput:
      type: object
      additionalProperties: false
      required: [grandma_id, plan_type, name, price, duration_days, deliveries_count, availability_status]
      properties:
        grandma_id:
          $ref: '#/components/schemas/Id'
        season_id:
          allOf:
            - $ref: '#/components/schemas/Id'
          nullable: true
        box_id:
          allOf:
            - $ref: '#/components/schemas/Id'
          nullable: true
          description: A box product of the same grandma.
        plan_type:
          $ref: '#/components/schemas/PlanType'
        name:
          type: string
          minLength: 1
          maxLength: 200
        image_url:
          type: string
          format: uri
        price:
          $ref: '#/components/schemas/Money'
        duration_days:
          type: integer
          minimum: 1
        deliveries_count:
          type: integer
          minimum: 1
        availability_status:
          $ref: '#/components/schemas/PlanAvailabilityStatus'
    CreateSubscriptionRequest:
      type: object
      additionalProperties: false
      required: [plan_id, start_date, address_id]
      properties:
        plan_id:
          $ref: '#/components/schemas/Id'
        start_date:
          type: string
          format: date
          description: Must not be in the past. No other limit is specified (§6).
        address_id:
          $ref: '#/components/schemas/Id'
        payment_method_id:
          allOf:
            - $ref: '#/components/schemas/Id'
          description: Optional preferred electronic method. The payment itself uses `POST /payments`.
    SubscriptionDelivery:
      type: object
      required: [id, subscription_id, delivery_date, status]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        subscription_id:
          $ref: '#/components/schemas/Id'
        delivery_date:
          type: string
          format: date
        status:
          $ref: '#/components/schemas/SubscriptionDeliveryStatus'
        updated_at:
          $ref: '#/components/schemas/Timestamp'
    SubscriptionDeliveryPage:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/SubscriptionDelivery'
        meta:
          $ref: '#/components/schemas/PageMeta'
    SubscriptionDeliveryStatusUpdate:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [preparing, delivered, cancelled]
    SubscriptionCancellationRequest:
      type: object
      required: [id, subscription_id, requested_at, status]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        subscription_id:
          $ref: '#/components/schemas/Id'
        requested_at:
          $ref: '#/components/schemas/Timestamp'
        reason:
          type: string
          nullable: true
        status:
          $ref: '#/components/schemas/CancellationRequestStatus'
        reviewed_by:
          allOf:
            - $ref: '#/components/schemas/Id'
          nullable: true
        reviewed_at:
          type: string
          format: date-time
          nullable: true
    CancellationRequestPage:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/SubscriptionCancellationRequest'
        meta:
          $ref: '#/components/schemas/PageMeta'
    Subscription:
      type: object
      required: [id, plan, customer_id, address, status, start_date, subtotal, fee_amount, total_price, created_at, updated_at]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        plan:
          $ref: '#/components/schemas/SubscriptionPlan'
        customer_id:
          $ref: '#/components/schemas/Id'
        address:
          allOf:
            - $ref: '#/components/schemas/Address'
          description: The address used. It may be soft-deleted. It is kept for history.
        status:
          $ref: '#/components/schemas/SubscriptionStatus'
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
          nullable: true
        payment_method:
          allOf:
            - $ref: '#/components/schemas/PaymentMethod'
          nullable: true
        payment_deadline:
          type: string
          format: date-time
          nullable: true
        subtotal:
          allOf:
            - $ref: '#/components/schemas/Money'
          description: Snapshot of the plan price. The commission base.
        fee_amount:
          allOf:
            - $ref: '#/components/schemas/Money'
          description: Zone fee × deliveries_count at checkout.
        total_price:
          allOf:
            - $ref: '#/components/schemas/Money'
          description: subtotal + fee_amount.
        created_at:
          $ref: '#/components/schemas/Timestamp'
        updated_at:
          $ref: '#/components/schemas/Timestamp'
        deliveries_done:
          type: integer
          readOnly: true
        deliveries_remaining:
          type: integer
          readOnly: true
        deliveries:
          type: array
