openapi: 3.0.3
info:
  title: Monat Al-Jaddat API (مونة الجدّات)
  version: 2.0.0
  description: |
    REST API contract for the «Monat Al-Jaddat» platform, release v1 of the product. This is contract version 2.0.0.

    **Sources of truth (priority order)**
    1. Requirements: `Monat_AlJaddat_Full_Concept_Simplified_Final_v33333333.md`, cited as **§n**.
    2. Data model: **ERD v2.0 Final** (37 entities). It replaces the previous ERD completely.
    Open items keep the ERD review IDs: **M-xx** (missing), **A-xx** (ambiguous), **C-xx** (conflict).

    **API conventions**
    - **Versioning:** the major version is in the URL (`/v1`). Breaking changes require a new major path.
      This document's `info.version` follows semantic versioning.
    - **IDs** are opaque strings, because the ERD allows int or uuid. The public QR lookup uses `VoiceMessage.uuid` and
      never the internal ID (A-12, ERD v2).
    - **Money** values are decimals with 2 places (`decimal(10,2)` in ERD v2), in the single platform currency.
    - **Responses:** a single resource is returned as the object itself. Lists are returned as
      `{ "data": [...], "meta": { page, page_size, total, total_pages } }`. Every error uses the same `ErrorResponse`
      envelope with a stable machine-readable `code`.
    - **Validation:** field-level failures return `422` with `error.details[]` (field + code + message).
      Business-rule conflicts (state transitions, uniqueness, still-referenced records) return `409`.
    - **Computed values** are read-only and never stored: `can_cancel`, `cancel_deadline`, grandma `avg_rating`,
      product `availability`, season `status`, delivered and remaining deliveries.
    - **Authorization:** bearer token plus role. Admin operations declare `x-required-permission` (a permission
      *section*, §1/§12). A Super Admin passes every admin check (§12). Customer resources are scoped to the token owner.
      Another customer's resource returns `404`, so its existence is not revealed.

    **Excluded by design (§17):** server-side cart (LocalStorage, §5), CMS, coupons, review moderation, grandma accounts,
    driver role, quotes, SMS/WhatsApp notifications, automatic settlement.

    **Open questions that still affect this contract** (not resolved by ERD v2, so not decided here):
    - Token format (JWT or opaque), lifetime and refresh. OTP length, expiry and storage (M-18).
    - Payment gateway provider and its handoff data (redirect URL, client secret) and webhook signature scheme (M-05).
    - `PaymentTransaction` has no owner column. A pre-order transaction (`order_id` and `subscription_id` both null) cannot be
      tied to a customer by the database alone. See `POST /payments`.
    - Cash on delivery: who sets `payment_status = paid`, and when (A-16). Partial refunds vs the single `refunded` value (C-04).
    - Cancellation policy parameters and cancellable stages (M-08, A-15). Rating scale (M-04).
    - Plan contents (A-02), box contents (A-03), `delivery_date` meaning per order type (A-05), permission catalogue (M-02).
    - File upload mechanism for images and audio (URLs are accepted).
x-background-jobs:
  description: |
    Asynchronous work required by the requirements. It runs outside the request cycle and is listed here so client
    behavior is clear. Scheduling technology, retries and queue design are implementation choices.
  jobs:
    - name: expire-unpaid-orders
      trigger: periodic
      rule: '`awaiting_payment` orders past `payment_deadline` → `cancelled`, reason "انتهاء مهلة الدفع"; history row with `changed_by = null`; notification `order_cancelled_payment_timeout` (§5, §13-9).'
    - name: expire-unpaid-subscriptions
      trigger: periodic
      rule: '`pending_payment` subscriptions past `payment_deadline` → `cancelled` (§6).'
    - name: process-payment-webhook
      trigger: 'POST /payments/webhook'
      rule: 'Idempotent on `gateway_reference`. Updates `PaymentTransaction.status`; on success moves the linked order to `confirmed`/`paid` or activates the linked subscription.'
    - name: generate-subscription-deliveries
      trigger: subscription activated
      rule: 'Create `deliveries_count` `SubscriptionDelivery` rows (`scheduled`): weekly from `start_date`, or every 3 months for seasonal plans (§6). Notification `subscription_activated`.'
    - name: upcoming-delivery-notifications
      trigger: periodic
      rule: 'Notification `subscription_delivery_upcoming` before a delivery (§3.9-هـ). Lead time not specified (M-13).'
    - name: complete-subscriptions
      trigger: delivery marked delivered
      rule: 'When every delivery of a subscription is delivered → `completed`; notification `subscription_ended`.'
servers:
  - url: http://localhost:3000/api/v1
    description: Placeholder host (not specified). The path carries the major API version.
tags:
  - name: Auth
    description: Registration, login, OTP and password recovery (§3.8)
  - name: Account
    description: Profile, addresses and in-app notifications (§3.9)
  - name: Catalog
    description: Public catalog - grandmas, categories, seasons, products, boxes, QR voice page (§2, §3.1–§3.6)
  - name: Checkout Reference Data
    description: Zones, countries, payment methods, delivery availability (§4, §5, §9)
  - name: Orders
    description: Customer orders - regular, scheduled, shipping, event, gift (§4, §5, §7, §8, §10)
  - name: Payments
    description: Electronic payment transactions and gateway webhook (§5, §6, ERD v2 PaymentTransaction)
  - name: Reviews
    description: Product reviews after delivery (§3.9)
  - name: Subscriptions
    description: Subscription plans and customer subscriptions (§3.7, §6)
  - name: Admin - Dashboard
    description: Statistics and follow-up lists (§11.1)
  - name: Admin - Orders
    description: The single orders table for all types (§11.2, §11.3, §11.8)
  - name: Admin - Grandmas
    description: Grandmas, recipes, voice messages, grandma of the month (§11.4)
  - name: Admin - Catalog
    description: Products, boxes, images, categories, seasons (§11.5, §11.6, §11.10)
  - name: Admin - Subscriptions
    description: Plans, subscriptions, cancellation requests, deliveries (§11.7)
  - name: Admin - Delivery & Shipping
    description: Zones, periods, slots, holidays, delivery settings, countries, companies (§9, §11.9)
  - name: Admin - Customers
    description: Customer accounts (§11.11)
  - name: Admin - Reports
    description: Sales, subscriptions, grandma dues (§11.12)
  - name: Super Admin
    description: Admins, permissions, system/payment/commission settings, activity log (§12)

security:
  - bearerAuth: []

paths:
  # =====================================================================
  # AUTH
  # =====================================================================
  /auth/register:
    post:
      tags: [Auth]
      summary: Start customer registration (sends OTP)
      description: |
        Validates the data and sends an OTP by SMS (§3.8). The account is created only after
        `POST /auth/register/verify-otp`, because OTP is **mandatory**. Admin accounts are created by the Super Admin (§12).
      operationId: register
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '202':
          description: OTP sent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OtpSentResponse'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /auth/register/verify-otp:
    post:
      tags: [Auth]
      summary: Verify the registration OTP and create the account
      operationId: verifyRegistrationOtp
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpVerifyRequest'
      responses:
        '201':
          description: Account created and signed in.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/InvalidOtp'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /auth/login:
    post:
      tags: [Auth]
      summary: Log in with phone number and password
      description: |
        §3.8. The same endpoint serves every role. The admin login identifier is not separately specified (M-01).
        `disabled` accounts are refused (§10.4, §12).
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Logged in.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /auth/logout:
    post:
      tags: [Auth]
      summary: End the current session
      operationId: logout
      responses:
        '204':
          description: Session ended.
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/password/forgot:
    post:
      tags: [Auth]
      summary: Request a password-reset OTP
      description: The response is the same whether or not the phone is registered, so accounts cannot be enumerated.
      operationId: forgotPassword
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PhoneRequest'
      responses:
        '202':
          description: OTP sent if the number is registered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OtpSentResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /auth/password/verify-otp:
    post:
      tags: [Auth]
      summary: Verify the password-reset OTP
      operationId: verifyPasswordResetOtp
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpVerifyRequest'
      responses:
        '200':
          description: OTP valid. Returns a short-lived single-use reset token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResetTokenResponse'
        '400':
          $ref: '#/components/responses/InvalidOtp'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /auth/password/reset:
    post:
      tags: [Auth]
      summary: Set a new password using the reset token
      operationId: resetPassword
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        '204':
          description: Password changed.
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/ValidationError'

  # =====================================================================
  # ACCOUNT
  # =====================================================================
  /me:
    get:
      tags: [Account]
      summary: Get my profile
      operationId: getMyProfile
      responses:
        '200':
          description: Current user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
    patch:
      tags: [Account]
      summary: Update my first and last name
      description: The phone number changes only through the OTP flow (§3.9-أ).
      operationId: updateMyProfile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
      responses:
        '200':
          description: Updated profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
  /me/phone/change-request:
    post:
      tags: [Account]
      summary: Request a phone change (OTP sent to the new number)
      operationId: requestPhoneChange
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PhoneRequest'
      responses:
        '202':
          description: OTP sent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OtpSentResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /me/phone/verify-otp:
    post:
      tags: [Account]
      summary: Confirm the phone change with the OTP
      operationId: verifyPhoneChange
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpVerifyRequest'
      responses:
        '200':
          description: Phone changed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/InvalidOtp'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /me/password:
    put:
      tags: [Account]
      summary: Change my password
      operationId: changeMyPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '204':
          description: Password changed.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
  /me/addresses:
    get:
      tags: [Account]
      summary: List my active addresses
      description: Soft-deleted addresses (`deleted_at` set) are never listed.
      operationId: listMyAddresses
      responses:
        '200':
          description: Addresses.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Address'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Account]
      summary: Add an address
      description: |
        The zone must be an active service zone (§3.9-ب). With `is_default = true`, the previous default is unset
        (at most one active default per user; ERD v2 partial unique index).
      operationId: createMyAddress
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddressInput'
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Address'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
  /me/addresses/{addressId}:
    parameters:
      - $ref: '#/components/parameters/AddressId'
    get:
      tags: [Account]
      summary: Get one of my addresses
      operationId: getMyAddress
      responses:
        '200':
          description: Address.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Address'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Account]
      summary: Update one of my addresses
      description: |
        **ERD v2 address lifecycle (A-06):** if the address is already referenced by an order or subscription, the update
        **creates a new address row** and soft-deletes the old one. Orders and subscriptions keep the address they used.
        The response is the current address, and **its `id` may differ from the path ID**. Clients must use the returned `id`.
      operationId: updateMyAddress
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddressInput'
      responses:
        '200':
          description: Current version of the address (same or new `id`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Address'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags: [Account]
      summary: Delete one of my addresses (soft delete)
      description: Sets `deleted_at` (§3.9-ب, ERD v2). Orders and subscriptions that reference it are unaffected.
      operationId: deleteMyAddress
      responses:
        '204':
          description: Deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /me/notifications:
    get:
      tags: [Account]
      summary: List my in-app notifications (newest first)
      operationId: listMyNotifications
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/NotificationStatus'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Notifications.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /me/notifications/{notificationId}:
    parameters:
      - name: notificationId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Id'
    patch:
      tags: [Account]
      summary: Mark a notification as read
      operationId: updateMyNotification
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotificationStatusUpdate'
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Notification'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

  # =====================================================================
  # PUBLIC CATALOG
  # =====================================================================
  /settings/public:
    get:
      tags: [Catalog]
      summary: Public platform settings (name, language, currency)
      operationId: getPublicSettings
      security: []
      responses:
        '200':
          description: Public settings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicSettings'
  /categories:
    get:
      tags: [Catalog]
      summary: List active categories
      operationId: listCategories
      security: []
      responses:
        '200':
          description: Categories.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Category'
  /seasons:
    get:
      tags: [Catalog]
      summary: List seasons
      description: For the season filter and "season boxes" on the home page (§2, §3.1).
      operationId: listSeasons
      security: []
      parameters:
        - name: status
          in: query
          required: false
          description: Computed from the dates (A-10).
          schema:
            $ref: '#/components/schemas/SeasonStatus'
      responses:
        '200':
          description: Seasons.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Season'
  /grandmas:
    get:
      tags: [Catalog]
      summary: List grandmas
      description: |
        "جدّاتنا" and grandma of the month on the home page (§3.1). Returns `active` and `unavailable` grandmas.
        `pending` grandmas are not approved, so they are not public (§11.4).
      operationId: listGrandmas
      security: []
      parameters:
        - name: is_grandma_of_month
          in: query
          required: false
          schema:
            type: boolean
        - name: q
          in: query
          required: false
          schema:
            type: string
            maxLength: 100
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Grandmas.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GrandmaPage'
        '422':
          $ref: '#/components/responses/ValidationError'
  /grandmas/{grandmaId}:
    parameters:
      - $ref: '#/components/parameters/GrandmaId'
    get:
      tags: [Catalog]
      summary: Grandma page
      description: Story, bio, recipes, active voice messages and computed rating (§3.3). Products come from `GET /products?grandma_id=`.
      operationId: getGrandma
      security: []
      responses:
        '200':
          description: Grandma.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GrandmaDetail'
        '404':
          $ref: '#/components/responses/NotFound'
  /products:
    get:
      tags: [Catalog]
      summary: List active products of a sales channel
      description: |
        `channel=regular` (default) is the general store (§3.2). `shipping` is the shipping catalog (§3.6-أ); choosing a
        country does not filter it. `event` is the events catalog (§3.6-ب). `is_box=true` lists the Boxes page (§3.5).
      operationId: listProducts
      security: []
      parameters:
        - name: channel
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/OrderType'
        - name: q
          in: query
          required: false
          description: Search by product or grandma name (§3.2).
          schema:
            type: string
            maxLength: 100
        - name: category_id
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/Id'
        - name: grandma_id
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/Id'
        - name: season_id
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/Id'
        - name: availability
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/AvailabilityLabel'
        - name: is_box
          in: query
          required: false
          schema:
            type: boolean
        - name: sort
          in: query
          required: false
          description: Sort order (§3.2).
          schema:
            type: string
            enum: [most_ordered, newest, price_asc, price_desc, rating]
            default: newest
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Products.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductPage'
        '422':
          $ref: '#/components/responses/ValidationError'
  /products/{productId}:
    parameters:
      - $ref: '#/components/parameters/ProductId'
    get:
      tags: [Catalog]
      summary: Product or box details
      description: For a box, `box` contains its contents. The QR voice message is resolved by uuid (§3.4, §3.5).
      operationId: getProduct
      security: []
      responses:
        '200':
          description: Product.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '404':
          $ref: '#/components/responses/NotFound'
  /voice-messages/{voiceMessageUuid}:
    parameters:
      - name: voiceMessageUuid
        in: path
        required: true
        description: Public QR token (`VoiceMessage.uuid`, ERD v2). The internal ID is never accepted here.
        schema:
          type: string
          format: uuid
    get:
      tags: [Catalog]
      summary: Public QR voice-message page
      description: |
        Opened by scanning the QR in a box (§3.5, §7). It shows no order or sender data. Returns `404` if the uuid is unknown
        or the message is `inactive`.
      operationId: getVoiceMessageByUuid
      security: []
      responses:
        '200':
          description: Voice message.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VoiceMessagePublic'
        '404':
          $ref: '#/components/responses/NotFound'

  # =====================================================================
  # CHECKOUT REFERENCE DATA
  # =====================================================================
  /delivery-zones:
    get:
      tags: [Checkout Reference Data]
      summary: List active service zones with fees
      operationId: listDeliveryZones
      security: []
      responses:
        '200':
          description: Zones.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DeliveryZone'
  /shipping-countries:
    get:
      tags: [Checkout Reference Data]
      summary: List supported shipping countries with predefined fees
      operationId: listShippingCountries
      security: []
      responses:
        '200':
          description: Countries.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ShippingCountry'
  /payment-methods:
    get:
      tags: [Checkout Reference Data]
      summary: List active payment methods
      description: Cash on delivery is for regular or scheduled orders only. Everything else is electronic (§5).
      operationId: listPaymentMethods
      security: []
      responses:
        '200':
          description: Methods.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PaymentMethod'
  /delivery/availability:
    get:
      tags: [Checkout Reference Data]
      summary: Available local-delivery dates and periods
      description: |
        Uses delivery slots, holidays and `DeliverySetting.min_preparation_hours` (§9.1). No returned date is earlier than
        **today + the longest `lead_time_days`** of `product_ids` (§4). `earliest` is the slot auto-assigned to non-scheduled
        regular orders. Production capacity is not checked (§4, §15).
      operationId: getDeliveryAvailability
      security: []
      parameters:
        - name: product_ids
          in: query
          required: false
          style: form
          explode: true
          schema:
            type: array
            maxItems: 50
            items:
              $ref: '#/components/schemas/Id'
        - name: date_from
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: date_to
          in: query
          required: false
          description: The window is at most 60 days (protects the computation).
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Availability.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeliveryAvailability'
        '422':
          $ref: '#/components/responses/ValidationError'

  # =====================================================================
  # ORDERS (customer)
  # =====================================================================
  /orders/preview:
    post:
      tags: [Orders]
      summary: Re-validate the cart and price it (no order is created)
      description: |
        The cart is in LocalStorage (§5). The backend re-checks products, prices, stock, channel, single grandma, zone,
        country, dates and gift rules. It returns totals, `is_scheduled`, the auto-assigned delivery date and the fee.
        The same rules run again in `POST /orders`.
      operationId: previewOrder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckoutRequest'
      responses:
        '200':
          description: Preview.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderPreview'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/OrderValidationError'
  /orders:
    get:
      tags: [Orders]
      summary: My orders
      description: All order types on one page (§3.9-ج). Subscription deliveries are not orders (§6).
      operationId: listMyOrders
      parameters:
        - name: status_group
          in: query
          required: false
          description: UI tabs. `in_progress` = non-terminal; `completed` = delivered; `cancelled_or_rejected`.
          schema:
            type: string
            enum: [all, in_progress, completed, cancelled_or_rejected]
            default: all
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Orders (newest first).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderSummaryPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Orders]
      summary: Create an order (unified checkout)
      description: |
        **By order type (§5)**
        - `regular`: created as `pending`.
          - Cash on delivery: `payment_status = unpaid`.
          - Electronic: payment happens **before** the order exists (§5). The client first calls `POST /payments`
            with the same cart, waits for the transaction to reach `succeeded`, then sends `payment_transaction_id`.
            The order is created with `payment_status = paid`, and the transaction gets its `order_id`.
          - Scheduling is computed from the items (§4). Any `made_to_order` item makes the order scheduled, and then
            `delivery_date` and `delivery_period_id` are required. Otherwise the nearest slot is assigned.
        - `shipping` / `event`: created as `pending` with no payment. Payment happens after approval (§5-ب, §5-ج).

        **Server-side validation (§5)** returns `422` with a `details[].code` per failure. A price or availability change
        since the cart was built returns `409 PRICE_CHANGED` with a fresh preview. The order is created only after the
        customer accepts the new total (§5).
      operationId: createOrder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
      responses:
        '201':
          description: Order created.
          headers:
            Location:
              description: URL of the new order.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: '`PRICE_CHANGED`, or the payment transaction is not `succeeded`, is already linked, or its amount does not match.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PriceChangedErrorResponse'
        '422':
          $ref: '#/components/responses/OrderValidationError'
  /orders/{orderId}:
    parameters:
      - $ref: '#/components/parameters/OrderId'
    get:
      tags: [Orders]
      summary: My order details and timeline
      description: |
        Items, type details, timeline, reasons, refunds, and the backend-computed `can_cancel` and `cancel_deadline`
        (§3.9-ج, §16). Admin-only fields (`delivery_responsible_note`, `grandma_contact`) are omitted.
      operationId: getMyOrder
      responses:
        '200':
          description: Order.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /orders/{orderId}/cancel:
    parameters:
      - $ref: '#/components/parameters/OrderId'
    post:
      tags: [Orders]
      summary: Cancel my order
      description: |
        Allowed only when `can_cancel` is true (§3.9-ج, §4). The policy is not defined (M-08). The reason is optional for customers.
        Refunds of electronic payments are recorded by an admin (§11.2).
      operationId: cancelMyOrder
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OptionalReasonRequest'
      responses:
        '200':
          description: Cancelled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/InvalidTransition'
        '422':
          $ref: '#/components/responses/ValidationError'
  /orders/{orderId}/items/{orderItemId}/review:
    parameters:
      - $ref: '#/components/parameters/OrderId'
      - name: orderItemId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Id'
    post:
      tags: [Reviews]
      summary: Review a product of a delivered order
      description: |
        Only when the order is `delivered`. One review per order item (unique `order_item_id`). Published immediately (§3.9).
        Editing or deleting reviews is not specified (A-14), so no endpoint is exposed for it.
      operationId: createReview
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewInput'
      responses:
        '201':
          description: Published.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Review'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'

  # =====================================================================
  # PAYMENTS
  # =====================================================================
  /payments:
    post:
      tags: [Payments]
      summary: Start an electronic payment
      description: |
        Creates a `PaymentTransaction` (`pending`) for exactly one target. The **amount is always computed by the server**
        and never taken from the client:
        - `checkout`: a regular cart before order creation (§5). The transaction has no `order_id` until `POST /orders`
          links it (ERD v2: "nullable initially for pre-order regular checkout payment").
        - `order_id`: a `shipping` or `event` order in `awaiting_payment` before its `payment_deadline` ("Pay now", §3.9-ج).
        - `subscription_id`: a `pending_payment` subscription before its `payment_deadline` (§6). It pays `total_price`.

        The payment method must be an active `electronic` method. The final status arrives asynchronously through
        `POST /payments/webhook`. Poll `GET /payments/{paymentId}` meanwhile.
        **Open:** the gateway handoff data (redirect URL, client token) is provider-specific and not in the ERD (M-05).
        It is returned in the transient, unstored `gateway_action` object.
        **Security gap:** `PaymentTransaction` has no owner column. A pre-order (`checkout`) transaction can only be tied
        to the caller in application state, not by the database. Confirm how to bind ownership.
      operationId: createPayment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePaymentRequest'
      responses:
        '201':
          description: Transaction started.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentInitiation'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/InvalidTransition'
        '422':
          $ref: '#/components/responses/OrderValidationError'
  /payments/{paymentId}:
    parameters:
      - name: paymentId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Id'
    get:
      tags: [Payments]
      summary: Get a payment transaction status
      description: Used while waiting for the gateway result. Visible only to the customer who started it (see the ownership gap above).
      operationId: getPayment
      responses:
        '200':
          description: Transaction.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentTransaction'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /payments/webhook:
    post:
      tags: [Payments]
      summary: Payment gateway callback (server-to-server)
      description: |
        Called by the gateway, not by clients. Processing is **idempotent on `gateway_reference`** (unique in ERD v2). A replay
        of an already-final transaction returns `200` and changes nothing. Effects:
        - `succeeded` + order: `payment_status = paid`. A `shipping` or `event` order in `awaiting_payment` moves to `confirmed`, with a history row.
        - `succeeded` + subscription: the subscription becomes `active`, and deliveries and the notification are generated.
        - `failed`: `failure_reason` is stored. A linked order gets `payment_status = failed` (§10.3).
        A success that arrives after the payment deadline has expired the order or subscription is not covered by the requirements.
        **Authentication** is by gateway signature. The header name and algorithm depend on the provider (M-05).
      operationId: paymentWebhook
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentWebhookEvent'
      responses:
        '200':
          description: Accepted (also for duplicates).
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # =====================================================================
  # SUBSCRIPTIONS (public + customer)
  # =====================================================================
  /subscription-plans:
    get:
      tags: [Subscriptions]
      summary: List available plans
      description: Only `availability_status = active` plans, grouped in the UI by type (§3.7).
      operationId: listSubscriptionPlans
      security: []
      parameters:
        - name: plan_type
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/PlanType'
        - name: grandma_id
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/Id'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Plans.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionPlanPage'
  /subscription-plans/{planId}:
    parameters:
      - $ref: '#/components/parameters/PlanId'
    get:
      tags: [Subscriptions]
      summary: Plan details
      description: |
        `price` covers the boxes only (ERD v2). Delivery fees depend on the zone of the chosen address and are added at
        subscription time.
      operationId: getSubscriptionPlan
      security: []
      responses:
        '200':
          description: Plan.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionPlan'
        '404':
          $ref: '#/components/responses/NotFound'
  /subscriptions:
    get:
      tags: [Subscriptions]
      summary: My subscriptions (current and past)
      operationId: listMySubscriptions
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/SubscriptionStatus'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Subscriptions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Subscriptions]
      summary: Subscribe to a plan
      description: |
        Does not go through the cart (§6). The plan must be `active` and the address must be in an active zone.
        The server snapshots the pricing (ERD v2, C-01/C-02 resolved):
        - `subtotal` = `SubscriptionPlan.price`
        - `fee_amount` = `DeliveryZone.fee × deliveries_count`
        - `total_price` = `subtotal + fee_amount`, paid in full electronically
        The subscription is created as `pending_payment`, with `payment_deadline` = now + `payment_deadline_minutes`.
        Pay with `POST /payments` (`subscription_id`). Gift is not available (§7).
      operationId: createSubscription
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSubscriptionRequest'
      responses:
        '201':
          description: Created (pending payment).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subscription'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
  /subscriptions/{subscriptionId}:
    parameters:
      - $ref: '#/components/parameters/SubscriptionId'
    get:
      tags: [Subscriptions]
      summary: One of my subscriptions with deliveries
      operationId: getMySubscription
      responses:
        '200':
          description: Subscription.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subscription'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /subscriptions/{subscriptionId}/cancellation-requests:
    parameters:
      - $ref: '#/components/parameters/SubscriptionId'
    post:
      tags: [Subscriptions]
      summary: Request cancellation of my subscription
      description: |
        Reviewed by an admin. The platform policy decides the money for the remaining deliveries (§3.9-د, §6).
        A new request is refused while one is `pending`.
      operationId: requestSubscriptionCancellation
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OptionalReasonRequest'
      responses:
        '201':
          description: Recorded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionCancellationRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/InvalidTransition'
        '422':
          $ref: '#/components/responses/ValidationError'

