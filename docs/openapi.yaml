  /admin/orders/{orderId}/approve:
    parameters:
      - $ref: '#/components/parameters/OrderId'
    post:
      tags: [Admin - Orders]
      summary: Approve a pending order
      description: |
        From `pending` only (§11.2):
        - `regular` (incl. scheduled) → `confirmed`.
        - `shipping` / `event` → `awaiting_payment`, with `payment_deadline` = now + `payment_deadline_minutes`.
          Sends notification `order_approved_payment_requested`.
        Every status change inserts an `OrderStatusHistory` row.
      operationId: adminApproveOrder
      x-required-permission: orders
      responses:
        '200':
          description: Approved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/InvalidTransition'
  /admin/orders/{orderId}/reject:
    parameters:
      - $ref: '#/components/parameters/OrderId'
    post:
      tags: [Admin - Orders]
      summary: Reject a pending order with a reason
      description: From `pending` only (§10.2). The reason is required (§11.2). Sends notification `order_rejected`.
      operationId: adminRejectOrder
      x-required-permission: orders
