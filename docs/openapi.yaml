            $ref: '#/components/schemas/SubscriptionDelivery'
        cancellation_requests:
          type: array
          description: Detail views.
          items:
            $ref: '#/components/schemas/SubscriptionCancellationRequest'
        payment_transactions:
          type: array
          description: Detail views.
          items:
            $ref: '#/components/schemas/PaymentTransaction'
        refunds:
          type: array
          description: Detail views.
          items:
            $ref: '#/components/schemas/Refund'
    SubscriptionPage:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Subscription'
        meta:
          $ref: '#/components/schemas/PageMeta'

    # ------------------------------------------------------------- dashboard & reports
