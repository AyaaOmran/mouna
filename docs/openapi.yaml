          in: query
          required: false
          schema:
            type: boolean
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Products.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Admin - Catalog]
      summary: Create a product or a box
      description: |
        With `box` set, the product is created as a box, which needs the `boxes_gifts` permission (§11.10). Rules:
        - `made_to_order` ⇒ `lead_time_days > 0` and `allow_scheduling = true` (ERD v2 CHECK, §4).
        - `ready` ⇒ `stock` required. `made_to_order` ⇒ `stock` null.
        - `channels.shipping` is refused for the "Cooked dishes" category (§3.6). For a box, every content item must be shippable (§3.5).
        - A box's `voice_message_id` must belong to the same grandma (§3.5).
      operationId: adminCreateProduct
      x-required-permission: products
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductInput'
      responses:
