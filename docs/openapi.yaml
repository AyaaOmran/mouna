              schema:
                $ref: '#/components/schemas/GrandmaDuesReport'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'

  # =====================================================================
  # SUPER ADMIN
  # =====================================================================
  /super-admin/admins:
    get:
      tags: [Super Admin]
      summary: List admins
      operationId: superListAdmins
      x-required-role: super_admin
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/UserStatus'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Admins.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUserPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Super Admin]
      summary: Add an admin
      operationId: superCreateAdmin
      x-required-role: super_admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminCreateInput'
      responses:
        '201':
          description: Created (`role = admin`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUser'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
  /super-admin/admins/{adminId}:
    parameters:
      - $ref: '#/components/parameters/AdminId'
    get:
      tags: [Super Admin]
      summary: Get an admin with permissions
      operationId: superGetAdmin
      x-required-role: super_admin
      responses:
        '200':
          description: Admin.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUser'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Super Admin]
      summary: Edit or suspend / reactivate an admin
      description: Suspension sets `status = disabled`. Admins are never hard-deleted, because logs reference them (§12).
      operationId: superUpdateAdmin
      x-required-role: super_admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminUpdateInput'
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUser'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
  /super-admin/admins/{adminId}/permissions:
    parameters:
      - $ref: '#/components/parameters/AdminId'
    put:
      tags: [Super Admin]
      summary: Replace an admin's permissions
      description: The target must have `role = admin` (§12).
      operationId: superSetAdminPermissions
      x-required-role: super_admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PermissionAssignment'
      responses:
        '200':
          description: Replaced.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUser'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
  /super-admin/permissions:
    get:
      tags: [Super Admin]
      summary: Permission catalogue
      description: Seeded data. The full list of sections and operations is open (M-02).
      operationId: superListPermissions
      x-required-role: super_admin
      responses:
        '200':
          description: Permissions.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Permission'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /super-admin/settings/system:
    get:
      tags: [Super Admin]
      summary: Get all system settings
      operationId: superGetSystemSettings
      x-required-role: super_admin
      responses:
        '200':
          description: Settings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemSettings'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    patch:
      tags: [Super Admin]
      summary: Update system, payment-deadline or commission settings
      description: |
        Covers three Super Admin sections (§12): system settings (name, language, currency), payment settings
        (`payment_deadline_minutes`, one value for shipping, event and subscription payments) and commission (`commission_rate`).
        All of them live in the single `SystemSetting` row.
      operationId: superUpdateSystemSettings
      x-required-role: super_admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SystemSettingsUpdate'
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemSettings'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
  /super-admin/payment-methods:
    get:
      tags: [Super Admin]
      summary: List all payment methods (incl. inactive)
      description: Seeded data. Which electronic methods exist is open (M-05).
      operationId: superListPaymentMethods
      x-required-role: super_admin
      responses:
        '200':
          description: Methods.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PaymentMethod'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /super-admin/payment-methods/{paymentMethodId}:
    parameters:
      - name: paymentMethodId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Id'
    patch:
      tags: [Super Admin]
      summary: Enable or disable a payment method
      operationId: superUpdatePaymentMethod
      x-required-role: super_admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentMethodToggle'
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentMethod'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
  /super-admin/activity-logs:
    get:
      tags: [Super Admin]
      summary: Admin activity log (newest first)
      description: Which operations are logged is open (M-15).
      operationId: superListActivityLogs
      x-required-role: super_admin
      parameters:
        - name: user_id
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/Id'
        - name: entity_type
          in: query
          required: false
          schema:
            type: string
            maxLength: 50
        - name: date_from
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: date_to
          in: query
          required: false
          schema:
            type: string
            format: date
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Entries.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityLogPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

# =======================================================================
# COMPONENTS
# =======================================================================
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: |
        Access token from login or OTP verification. Format, lifetime and refresh are not specified.
        Roles: `customer`, `admin`, `super_admin`. A Guest is unauthenticated (§1).

  parameters:
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: page_size
      in: query
      required: false
      description: Capped at 100 to bound response size and query cost.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    AddressId:
      name: addressId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    GrandmaId:
      name: grandmaId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    ProductId:
      name: productId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    OrderId:
      name: orderId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    PlanId:
      name: planId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    SubscriptionId:
      name: subscriptionId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    CancellationRequestId:
      name: requestId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    AdminId:
      name: adminId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    ReportDateFrom:
      name: date_from
      in: query
      required: true
      schema:
        type: string
        format: date
    ReportDateTo:
      name: date_to
      in: query
      required: true
      schema:
        type: string
        format: date

  responses:
    BadRequest:
      description: Malformed request, or an invalid or expired token in the body.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: BAD_REQUEST
              message: Reset token is invalid or expired.
    Unauthorized:
      description: Missing, invalid or expired credentials.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: UNAUTHORIZED
              message: Authentication required.
    Forbidden:
      description: Authenticated, but the role or permission is missing, or the account is disabled.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: FORBIDDEN
              message: Missing permission "orders".
    NotFound:
      description: Not found, or not visible to the caller (no existence disclosure).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: NOT_FOUND
              message: Resource not found.
    Conflict:
      description: Uniqueness violation, duplicate action, or the record is still referenced.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: CONFLICT
              message: Phone number already registered.
    InvalidTransition:
      description: The action is not allowed in the current state (status machine, deadline, or `can_cancel = false`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: INVALID_STATE_TRANSITION
              message: Order cannot move from "pending" to "shipped".
    InvalidOtp:
      description: OTP invalid or expired.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: INVALID_OTP
              message: The verification code is invalid or expired.
    TooManyRequests:
      description: |
        Too many attempts (OTP and login protection, M-18). The limits are not specified in the requirements.
      headers:
        Retry-After:
          description: Seconds to wait before retrying.
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: RATE_LIMITED
              message: Too many attempts. Try again later.
    ValidationError:
      description: Field validation failed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: VALIDATION_ERROR
              message: The request contains invalid fields.
              details:
                - field: phone
                  code: required
                  message: Phone is required.
    OrderValidationError:
      description: |
        Checkout validation failed (§5). Possible `details[].code` values: `PRODUCT_NOT_AVAILABLE`, `OUT_OF_STOCK`,
        `CHANNEL_NOT_ALLOWED`, `MULTIPLE_GRANDMAS`, `GRANDMA_UNAVAILABLE`, `ZONE_NOT_SERVED`, `COUNTRY_NOT_SUPPORTED`,
        `DATE_BEFORE_LEAD_TIME`, `SCHEDULING_NOT_ALLOWED`, `SLOT_NOT_AVAILABLE`, `GIFT_NOT_ALLOWED`,
        `CASH_NOT_ALLOWED`, `PAYMENT_METHOD_INACTIVE`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: ORDER_VALIDATION_FAILED
              message: The order cannot be placed.
              details:
                - field: items[1].product_id
                  code: MULTIPLE_GRANDMAS
                  message: All items must belong to one grandma.

  schemas:
    # ------------------------------------------------------------- common
    Id:
      type: string
      description: Opaque identifier (int or uuid in ERD v2).
      example: '1021'
    Money:
      type: number
      format: double
      minimum: 0
      multipleOf: 0.01
      description: decimal(10,2) in the platform currency.
      example: 45.5
    Timestamp:
      type: string
      format: date-time
      readOnly: true
    TimeOfDay:
      type: string
      pattern: '^([01]\d|2[0-3]):[0-5]\d$'
      example: '09:00'
    PhoneNumber:
      type: string
      description: Phone number. The format is not specified; E.164 is recommended.
      minLength: 6
      maxLength: 20
      example: '+963900000000'
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: Stable machine-readable code.
            message:
              type: string
              description: Human-readable message in the platform language.
            details:
              type: array
              items:
                $ref: '#/components/schemas/ErrorDetail'
            request_id:
              type: string
              description: Correlation ID for support and logs.
    ErrorDetail:
      type: object
      required: [code, message]
      properties:
        field:
          type: string
          description: Path of the offending field, e.g. `items[0].quantity`.
        code:
          type: string
        message:
          type: string
    PageMeta:
      type: object
      required: [page, page_size, total, total_pages]
      properties:
        page:
          type: integer
        page_size:
          type: integer
        total:
          type: integer
        total_pages:
          type: integer
    OptionalReasonRequest:
      type: object
      additionalProperties: false
      properties:
        reason:
          type: string
          maxLength: 1000
    RequiredReasonRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 1000

    # ------------------------------------------------------------- enums
    UserRole:
      type: string
      enum: [customer, admin, super_admin]
    UserStatus:
      type: string
      enum: [active, disabled]
    GrandmaStatus:
      type: string
      enum: [pending, active, unavailable]
    CategoryStatus:
      type: string
      enum: [active, hidden]
    SeasonStatus:
      type: string
      enum: [upcoming, active, ended]
      description: Computed from the dates (A-10).
    ProductStatus:
      type: string
      enum: [draft, active, hidden]
    FulfillmentType:
      type: string
      enum: [ready, made_to_order]
    AvailabilityLabel:
      type: string
      enum: [available, made_to_order, unavailable]
      description: Computed from stock and fulfillment type (§10.4).
    OrderType:
      type: string
      enum: [regular, shipping, event]
    OrderStatus:
      type: string
      enum: [pending, awaiting_payment, confirmed, preparing, ready, out_for_delivery, shipped, in_transit, delivered, rejected, cancelled]
    PaymentStatus:
      type: string
      enum: [unpaid, paid, failed, refunded]
    PaymentMethodType:
      type: string
      enum: [cash_on_delivery, electronic]
    PaymentTransactionStatus:
      type: string
      enum: [pending, succeeded, failed]
    PlanType:
      type: string
      enum: [weekly, seasonal]
    PlanAvailabilityStatus:
      type: string
      enum: [active, unavailable]
    SubscriptionStatus:
      type: string
      enum: [pending_payment, active, completed, cancelled]
    SubscriptionDeliveryStatus:
      type: string
      enum: [scheduled, preparing, delivered, cancelled]
    CancellationRequestStatus:
      type: string
      enum: [pending, approved, rejected]
    VoiceMessageStatus:
      type: string
      enum: [active, inactive]
    NotificationStatus:
      type: string
      enum: [unread, read]
    NotificationType:
      type: string
      enum:
        - order_status_changed
        - order_approved_payment_requested
        - order_rejected
        - order_cancelled_payment_timeout
        - subscription_delivery_upcoming
        - subscription_activated
        - subscription_ended
    EventType:
      type: string
      enum: [wedding, engagement, graduation, birthday, gathering, company_event, other]

    # ------------------------------------------------------------- auth
    RegisterRequest:
      type: object
      additionalProperties: false
      required: [first_name, last_name, phone, password, confirm_password, accept_terms]
      properties:
        first_name:
          type: string
          minLength: 1
          maxLength: 100
        last_name:
          type: string
          minLength: 1
          maxLength: 100
        phone:
          $ref: '#/components/schemas/PhoneNumber'
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 128
          description: The minimum of 8 is a security baseline. The requirements give no password policy.
        confirm_password:
          type: string
          format: password
          description: Must equal `password`.
        accept_terms:
          type: boolean
          enum: [true]
          description: Must be accepted (§3.8). The acceptance is not stored, because the ERD has no column for it.
    LoginRequest:
      type: object
      additionalProperties: false
      required: [phone, password]
      properties:
        phone:
          $ref: '#/components/schemas/PhoneNumber'
        password:
          type: string
          format: password
    PhoneRequest:
      type: object
      additionalProperties: false
      required: [phone]
      properties:
        phone:
          $ref: '#/components/schemas/PhoneNumber'
    OtpVerifyRequest:
      type: object
      additionalProperties: false
      required: [phone, code]
      properties:
        phone:
          $ref: '#/components/schemas/PhoneNumber'
        code:
          type: string
          minLength: 4
          maxLength: 8
          pattern: '^\d+$'
          description: Numeric SMS code. The exact length is not specified (M-18).
    OtpSentResponse:
      type: object
      required: [phone]
      properties:
        phone:
          $ref: '#/components/schemas/PhoneNumber'
        expires_at:
          type: string
          format: date-time
    ResetTokenResponse:
      type: object
      required: [reset_token]
      properties:
        reset_token:
          type: string
    ResetPasswordRequest:
      type: object
      additionalProperties: false
      required: [reset_token, password, confirm_password]
      properties:
        reset_token:
          type: string
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 128
        confirm_password:
          type: string
          format: password
    ChangePasswordRequest:
      type: object
      additionalProperties: false
      required: [current_password, password, confirm_password]
      properties:
        current_password:
          type: string
          format: password
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 128
        confirm_password:
          type: string
          format: password
    AuthResponse:
      type: object
      required: [access_token, token_type, user]
      properties:
        access_token:
          type: string
        token_type:
          type: string
          enum: [Bearer]
        user:
          $ref: '#/components/schemas/User'
    UpdateProfileRequest:
      type: object
      additionalProperties: false
      required: [first_name, last_name]
      properties:
        first_name:
          type: string
          minLength: 1
          maxLength: 100
        last_name:
          type: string
          minLength: 1
          maxLength: 100

    # ------------------------------------------------------------- users & access
    User:
      type: object
      description: '`password_hash` is never exposed.'
      required: [id, role, first_name, last_name, phone, status, created_at, updated_at]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        role:
          $ref: '#/components/schemas/UserRole'
        first_name:
          type: string
        last_name:
          type: string
        phone:
          $ref: '#/components/schemas/PhoneNumber'
        status:
          $ref: '#/components/schemas/UserStatus'
        created_at:
          $ref: '#/components/schemas/Timestamp'
        updated_at:
          $ref: '#/components/schemas/Timestamp'
    UserPage:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/User'
        meta:
          $ref: '#/components/schemas/PageMeta'
    CustomerDetail:
      allOf:
        - $ref: '#/components/schemas/User'
        - type: object
          required: [addresses]
          properties:
            addresses:
              type: array
              items:
                $ref: '#/components/schemas/Address'
    Permission:
      type: object
      required: [id, section, operation]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        section:
          type: string
          description: e.g. products, orders, subscriptions, events, shipping_delivery_settings, boxes_gifts, customers, reports (§1, §12).
          example: orders
        operation:
          type: string
          description: Granularity open (M-02).
    PermissionAssignment:
      type: object
      additionalProperties: false
      required: [permission_ids]
      properties:
        permission_ids:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/Id'
    AdminUser:
      allOf:
        - $ref: '#/components/schemas/User'
        - type: object
          required: [permissions]
          properties:
            permissions:
              type: array
              description: Empty for `super_admin`, who has every permission.
              items:
                $ref: '#/components/schemas/Permission'
    AdminUserPage:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/AdminUser'
        meta:
          $ref: '#/components/schemas/PageMeta'
    AdminCreateInput:
      type: object
      additionalProperties: false
      required: [first_name, last_name, phone, password]
      properties:
        first_name:
          type: string
          minLength: 1
          maxLength: 100
        last_name:
          type: string
          minLength: 1
          maxLength: 100
        phone:
          $ref: '#/components/schemas/PhoneNumber'
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 128
        permission_ids:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/Id'
    AdminUpdateInput:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        first_name:
          type: string
          minLength: 1
          maxLength: 100
        last_name:
          type: string
          minLength: 1
          maxLength: 100
        phone:
          $ref: '#/components/schemas/PhoneNumber'
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 128
        status:
          $ref: '#/components/schemas/UserStatus'
    ActivityLog:
      type: object
      required: [id, user_id, action, occurred_at]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        user_id:
          $ref: '#/components/schemas/Id'
        action:
          type: string
        entity_type:
          type: string
          nullable: true
        entity_id:
          allOf:
            - $ref: '#/components/schemas/Id'
          nullable: true
        occurred_at:
          type: string
          format: date-time
    ActivityLogPage:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ActivityLog'
        meta:
          $ref: '#/components/schemas/PageMeta'

    # ------------------------------------------------------------- addresses & notifications
    Address:
      type: object
      required: [id, delivery_zone_id, city, street, phone, is_default, created_at, updated_at]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        delivery_zone_id:
          $ref: '#/components/schemas/Id'
        delivery_zone:
          $ref: '#/components/schemas/DeliveryZone'
        city:
          type: string
        street:
          type: string
        access_details:
          type: string
          nullable: true
        phone:
          $ref: '#/components/schemas/PhoneNumber'
        is_default:
          type: boolean
        created_at:
          $ref: '#/components/schemas/Timestamp'
        updated_at:
          $ref: '#/components/schemas/Timestamp'
        deleted_at:
          type: string
          format: date-time
          nullable: true
          readOnly: true
          description: Soft-delete time. Set only on addresses seen through an order or subscription.
    AddressInput:
      type: object
      additionalProperties: false
      required: [delivery_zone_id, city, street, phone]
      properties:
        delivery_zone_id:
          $ref: '#/components/schemas/Id'
        city:
          type: string
          minLength: 1
          maxLength: 100
        street:
          type: string
          minLength: 1
          maxLength: 255
        access_details:
          type: string
          maxLength: 1000
        phone:
          $ref: '#/components/schemas/PhoneNumber'
        is_default:
          type: boolean
          default: false
    Notification:
      type: object
      required: [id, type, message, status, created_at]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        type:
          $ref: '#/components/schemas/NotificationType'
        message:
          type: string
        status:
          $ref: '#/components/schemas/NotificationStatus'
        order_id:
          allOf:
            - $ref: '#/components/schemas/Id'
          nullable: true
        subscription_id:
          allOf:
            - $ref: '#/components/schemas/Id'
          nullable: true
        created_at:
          $ref: '#/components/schemas/Timestamp'
    NotificationPage:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Notification'
        meta:
          $ref: '#/components/schemas/PageMeta'
    NotificationStatusUpdate:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [read]

    # ------------------------------------------------------------- catalog
    Category:
      type: object
      required: [id, name, status]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        name:
          type: string
          example: مونة
        status:
          $ref: '#/components/schemas/CategoryStatus'
        created_at:
          $ref: '#/components/schemas/Timestamp'
        updated_at:
          $ref: '#/components/schemas/Timestamp'
    CategoryInput:
      type: object
      additionalProperties: false
      required: [name, status]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        status:
          $ref: '#/components/schemas/CategoryStatus'
    Season:
      type: object
      required: [id, name, start_date, end_date, status]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        name:
          type: string
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
        status:
          allOf:
            - $ref: '#/components/schemas/SeasonStatus'
          readOnly: true
        created_at:
          $ref: '#/components/schemas/Timestamp'
        updated_at:
          $ref: '#/components/schemas/Timestamp'
    SeasonInput:
      type: object
      additionalProperties: false
      required: [name, start_date, end_date]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
    GrandmaRef:
      type: object
      required: [id, name]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        name:
          type: string
    Grandma:
      type: object
      required: [id, name, status, is_grandma_of_month]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        name:
          type: string
        image_url:
          type: string
          format: uri
          nullable: true
        story:
          type: string
          nullable: true
        bio:
          type: string
          nullable: true
        status:
          $ref: '#/components/schemas/GrandmaStatus'
        is_grandma_of_month:
          type: boolean
        avg_rating:
          type: number
          format: double
          nullable: true
          readOnly: true
          description: Computed from her products' reviews (§3.3). Not stored.
    GrandmaPage:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Grandma'
        meta:
          $ref: '#/components/schemas/PageMeta'
    GrandmaDetail:
      allOf:
        - $ref: '#/components/schemas/Grandma'
        - type: object
          required: [recipes, voice_messages]
          properties:
            recipes:
              type: array
              items:
                $ref: '#/components/schemas/Recipe'
            voice_messages:
              type: array
              description: Active messages only.
              items:
                $ref: '#/components/schemas/VoiceMessagePublic'
    GrandmaAdmin:
      allOf:
        - $ref: '#/components/schemas/Grandma'
        - type: object
          properties:
            admin_phone:
              allOf:
                - $ref: '#/components/schemas/PhoneNumber'
              nullable: true
              description: Admin only (§11.4).
            order_hours_from:
              allOf:
                - $ref: '#/components/schemas/TimeOfDay'
              nullable: true
            order_hours_to:
              allOf:
                - $ref: '#/components/schemas/TimeOfDay'
              nullable: true
            products_count:
              type: integer
              readOnly: true
            created_at:
              $ref: '#/components/schemas/Timestamp'
            updated_at:
              $ref: '#/components/schemas/Timestamp'
    GrandmaAdminPage:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/GrandmaAdmin'
        meta:
          $ref: '#/components/schemas/PageMeta'
    GrandmaInput:
      type: object
      additionalProperties: false
      required: [name, status]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        image_url:
          type: string
          format: uri
        story:
          type: string
        bio:
          type: string
        admin_phone:
          $ref: '#/components/schemas/PhoneNumber'
        order_hours_from:
          $ref: '#/components/schemas/TimeOfDay'
        order_hours_to:
          $ref: '#/components/schemas/TimeOfDay'
        status:
          $ref: '#/components/schemas/GrandmaStatus'
    Recipe:
      type: object
      required: [id, grandma_id, title]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        grandma_id:
          $ref: '#/components/schemas/Id'
        title:
          type: string
        content:
          type: string
          nullable: true
        created_at:
          $ref: '#/components/schemas/Timestamp'
        updated_at:
          $ref: '#/components/schemas/Timestamp'
    RecipeInput:
      type: object
      additionalProperties: false
      required: [title]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        content:
          type: string
    VoiceMessage:
      type: object
      required: [id, uuid, grandma_id, audio_url, status]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        uuid:
          type: string
          format: uuid
          readOnly: true
          description: Public QR token. It is generated by the server and is immutable.
        grandma_id:
          $ref: '#/components/schemas/Id'
        audio_url:
          type: string
          format: uri
        title:
          type: string
          nullable: true
        status:
          $ref: '#/components/schemas/VoiceMessageStatus'
        created_at:
          $ref: '#/components/schemas/Timestamp'
        updated_at:
          $ref: '#/components/schemas/Timestamp'
    VoiceMessagePublic:
      type: object
      description: Public view, with no internal ID and no order data.
      required: [uuid, audio_url, grandma]
      properties:
        uuid:
          type: string
          format: uuid
        audio_url:
          type: string
          format: uri
        title:
          type: string
          nullable: true
        grandma:
          $ref: '#/components/schemas/GrandmaRef'
    VoiceMessageInput:
      type: object
      additionalProperties: false
      required: [audio_url, status]
      properties:
        audio_url:
          type: string
          format: uri
        title:
          type: string
          maxLength: 200
        status:
          $ref: '#/components/schemas/VoiceMessageStatus'
    ProductImage:
      type: object
      required: [id, image_url]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        image_url:
          type: string
          format: uri
    ProductImageInput:
      type: object
      additionalProperties: false
      required: [image_url]
      properties:
        image_url:
          type: string
          format: uri
    ProductChannels:
      type: object
      additionalProperties: false
      required: [regular, shipping, event]
      description: Maps to `channel_regular`, `channel_shipping` and `channel_event`. `shipping` also means eligible for shipping (A-04).
      properties:
        regular:
          type: boolean
        shipping:
          type: boolean
        event:
          type: boolean
    Product:
      type: object
      required: [id, grandma, category, name, price, sale_unit, status, fulfillment_type, allow_scheduling, channels, availability, is_box, images]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        grandma:
          $ref: '#/components/schemas/GrandmaRef'
        category:
          $ref: '#/components/schemas/Category'
        season:
          allOf:
            - $ref: '#/components/schemas/Season'
          nullable: true
        name:
          type: string
        description:
          type: string
          nullable: true
        price:
          $ref: '#/components/schemas/Money'
        sale_unit:
          type: string
          description: One price and one unit per product (§3.4).
        storage_method:
          type: string
          nullable: true
        status:
          $ref: '#/components/schemas/ProductStatus'
        fulfillment_type:
          $ref: '#/components/schemas/FulfillmentType'
        lead_time_days:
          type: integer
          minimum: 1
          nullable: true
        stock:
          type: number
          format: double
          minimum: 0
          nullable: true
          description: decimal in ERD v2. Null for made-to-order products.
        allow_scheduling:
          type: boolean
        channels:
          $ref: '#/components/schemas/ProductChannels'
        availability:
          allOf:
            - $ref: '#/components/schemas/AvailabilityLabel'
          readOnly: true
        rating_avg:
          type: number
          format: double
          nullable: true
          readOnly: true
          description: Computed from `Review`, for the product card and the rating sort (§3.2). Not stored.
        images:
          type: array
          items:
            $ref: '#/components/schemas/ProductImage'
        is_box:
          type: boolean
          readOnly: true
        box:
          allOf:
            - $ref: '#/components/schemas/Box'
          nullable: true
        created_at:
          $ref: '#/components/schemas/Timestamp'
        updated_at:
          $ref: '#/components/schemas/Timestamp'
    ProductPage:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Product'
        meta:
          $ref: '#/components/schemas/PageMeta'
    ProductInput:
      type: object
      additionalProperties: false
      required: [grandma_id, category_id, name, price, sale_unit, status, fulfillment_type, allow_scheduling, channels]
      properties:
        grandma_id:
          $ref: '#/components/schemas/Id'
        category_id:
          $ref: '#/components/schemas/Id'
        season_id:
          allOf:
            - $ref: '#/components/schemas/Id'
          nullable: true
        name:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
        price:
          $ref: '#/components/schemas/Money'
        sale_unit:
          type: string
          minLength: 1
          maxLength: 50
        storage_method:
          type: string
          maxLength: 500
        status:
          $ref: '#/components/schemas/ProductStatus'
        fulfillment_type:
          $ref: '#/components/schemas/FulfillmentType'
        lead_time_days:
          type: integer
          minimum: 1
          nullable: true
        stock:
          type: number
          format: double
          minimum: 0
          nullable: true
        allow_scheduling:
          type: boolean
        channels:
          $ref: '#/components/schemas/ProductChannels'
        box:
          allOf:
            - $ref: '#/components/schemas/BoxInput'
          nullable: true
    Box:
      type: object
      required: [items]
      description: Product subtype. Its stock is `Product.stock`, independent of its contents (§3.5).
      properties:
        voice_message_id:
          allOf:
            - $ref: '#/components/schemas/Id'
          nullable: true
        voice_message:
          allOf:
            - $ref: '#/components/schemas/VoiceMessagePublic'
          nullable: true
          description: Linked QR voice message. Its `uuid` goes into the printed QR code.
        items:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/BoxItem'
    BoxItem:
      type: object
      required: [id, quantity]
      description: A product reference and/or a free-text name (A-03).
      properties:
        id:
          $ref: '#/components/schemas/Id'
        product_id:
          allOf:
            - $ref: '#/components/schemas/Id'
          nullable: true
        item_name:
          type: string
          nullable: true
        quantity:
          type: number
          format: double
          minimum: 0
          exclusiveMinimum: true
    BoxInput:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        voice_message_id:
          allOf:
            - $ref: '#/components/schemas/Id'
          nullable: true
        items:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/BoxItemInput'
    BoxItemInput:
      type: object
      additionalProperties: false
      required: [quantity]
      description: At least one of `product_id` and `item_name` is required.
      properties:
        product_id:
          $ref: '#/components/schemas/Id'
        item_name:
          type: string
          maxLength: 200
        quantity:
          type: number
          format: double
          minimum: 0
          exclusiveMinimum: true

    # ------------------------------------------------------------- delivery / shipping / payment config
    DeliveryZone:
      type: object
      required: [id, name, fee, is_active]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        name:
          type: string
        fee:
          $ref: '#/components/schemas/Money'
        is_active:
          type: boolean
    DeliveryZoneInput:
      type: object
      additionalProperties: false
      required: [name, fee, is_active]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        fee:
          $ref: '#/components/schemas/Money'
        is_active:
          type: boolean
    ShippingCountry:
      type: object
      required: [id, name, fee, is_active]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        name:
          type: string
        fee:
          $ref: '#/components/schemas/Money'
        is_active:
          type: boolean
    ShippingCountryInput:
      type: object
      additionalProperties: false
      required: [name, fee, is_active]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        fee:
          $ref: '#/components/schemas/Money'
        is_active:
          type: boolean
    ShippingCompany:
      type: object
      required: [id, name]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        name:
          type: string
    ShippingCompanyInput:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
    DeliveryPeriod:
      type: object
      required: [id, start_time, end_time]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        name:
          type: string
          nullable: true
        start_time:
          $ref: '#/components/schemas/TimeOfDay'
        end_time:
          $ref: '#/components/schemas/TimeOfDay'
    DeliveryPeriodInput:
      type: object
      additionalProperties: false
      required: [start_time, end_time]
      description: '`end_time` must be after `start_time`.'
      properties:
        name:
          type: string
          maxLength: 100
        start_time:
          $ref: '#/components/schemas/TimeOfDay'
        end_time:
          $ref: '#/components/schemas/TimeOfDay'
    DeliverySlot:
      type: object
      required: [id, weekday, delivery_period_id]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        weekday:
          type: integer
          minimum: 0
          maximum: 6
          description: 0–6. Which day is 0 is not specified.
        delivery_period_id:
          $ref: '#/components/schemas/Id'
    DeliverySlotInput:
      type: object
      additionalProperties: false
      required: [weekday, delivery_period_id]
      properties:
        weekday:
          type: integer
          minimum: 0
          maximum: 6
        delivery_period_id:
          $ref: '#/components/schemas/Id'
    Holiday:
      type: object
      required: [id, holiday_date]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        holiday_date:
          type: string
          format: date
        name:
          type: string
          nullable: true
    HolidayInput:
      type: object
      additionalProperties: false
      required: [holiday_date]
      properties:
        holiday_date:
          type: string
          format: date
        name:
          type: string
          maxLength: 100
    DeliverySettings:
      type: object
      required: [min_preparation_hours]
      properties:
        min_preparation_hours:
          type: integer
          minimum: 0
          description: Minimum preparation before the nearest delivery slot (§9.1).
          example: 4
        updated_at:
          $ref: '#/components/schemas/Timestamp'
    DeliverySettingsInput:
      type: object
      additionalProperties: false
      required: [min_preparation_hours]
      properties:
        min_preparation_hours:
          type: integer
          minimum: 0
    DeliveryAvailability:
      type: object
      required: [min_date, dates]
      properties:
        min_date:
          type: string
          format: date
        earliest:
          type: object
          nullable: true
          required: [date, delivery_period]
          properties:
            date:
              type: string
              format: date
            delivery_period:
              $ref: '#/components/schemas/DeliveryPeriod'
        dates:
          type: array
          items:
            type: object
            required: [date, periods]
            properties:
              date:
                type: string
                format: date
              periods:
                type: array
                items:
                  $ref: '#/components/schemas/DeliveryPeriod'
    PaymentMethod:
      type: object
      required: [id, name, type, is_active]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        name:
          type: string
        type:
          $ref: '#/components/schemas/PaymentMethodType'
        is_active:
          type: boolean
    PaymentMethodToggle:
      type: object
      additionalProperties: false
      required: [is_active]
      properties:
        is_active:
          type: boolean
    PublicSettings:
      type: object
      required: [platform_name, language, currency]
      properties:
        platform_name:
          type: string
        language:
          type: string
          example: ar
        currency:
          type: string
    SystemSettings:
      allOf:
        - $ref: '#/components/schemas/PublicSettings'
        - type: object
          required: [payment_deadline_minutes, commission_rate]
          properties:
            payment_deadline_minutes:
              type: integer
              minimum: 1
              description: Payment deadline for shipping, event and subscription payments (§5, §12).
              example: 1440
            commission_rate:
              type: number
              format: double
              minimum: 0
              maximum: 100
              description: Platform percentage (§11.12).
              example: 15
            updated_at:
              $ref: '#/components/schemas/Timestamp'
    SystemSettingsUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        platform_name:
          type: string
          minLength: 1
          maxLength: 100
        language:
          type: string
          minLength: 2
          maxLength: 10
        currency:
          type: string
          minLength: 1
          maxLength: 10
        payment_deadline_minutes:
          type: integer
          minimum: 1
        commission_rate:
          type: number
          format: double
          minimum: 0
          maximum: 100

    # ------------------------------------------------------------- payments
    PaymentTransaction:
      type: object
      required: [id, payment_method_id, amount, status, created_at, updated_at]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        order_id:
          allOf:
            - $ref: '#/components/schemas/Id'
          nullable: true
          description: Null for a pre-order checkout payment until `POST /orders` links it.
        subscription_id:
          allOf:
            - $ref: '#/components/schemas/Id'
          nullable: true
          description: Never set together with `order_id` (ERD v2 CHECK).
        payment_method_id:
          $ref: '#/components/schemas/Id'
        gateway_reference:
          type: string
          nullable: true
          description: Provider transaction ID. Unique, and used as the idempotency key.
        amount:
          $ref: '#/components/schemas/Money'
        status:
          $ref: '#/components/schemas/PaymentTransactionStatus'
        failure_reason:
          type: string
          nullable: true
        created_at:
          $ref: '#/components/schemas/Timestamp'
        updated_at:
          $ref: '#/components/schemas/Timestamp'
    CreatePaymentRequest:
      type: object
      additionalProperties: false
      required: [payment_method_id]
      description: Provide **exactly one** of `checkout`, `order_id`, `subscription_id`.
      properties:
        payment_method_id:
          allOf:
            - $ref: '#/components/schemas/Id'
          description: Active electronic method.
        checkout:
          $ref: '#/components/schemas/CheckoutRequest'
        order_id:
          $ref: '#/components/schemas/Id'
        subscription_id:
          $ref: '#/components/schemas/Id'
    PaymentInitiation:
      type: object
      required: [transaction]
      properties:
        transaction:
          $ref: '#/components/schemas/PaymentTransaction'
        gateway_action:
          type: object
          nullable: true
          additionalProperties: true
          description: |
            Transient and not stored. Provider-specific data the client needs to complete the payment
            (redirect URL, client token). The shape is TBD (M-05).
    PaymentWebhookEvent:
      type: object
      required: [gateway_reference, status]
      description: Normalized shape. The real payload and signature depend on the provider (M-05).
      properties:
        gateway_reference:
          type: string
        status:
          type: string
          enum: [succeeded, failed]
        amount:
          $ref: '#/components/schemas/Money'
        failure_reason:
          type: string
    Refund:
      type: object
      required: [id, amount, recorded_by, recorded_at]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        order_id:
          allOf:
            - $ref: '#/components/schemas/Id'
          nullable: true
        subscription_id:
          allOf:
            - $ref: '#/components/schemas/Id'
          nullable: true
        amount:
          $ref: '#/components/schemas/Money'
        reason:
          type: string
          nullable: true
        recorded_by:
          $ref: '#/components/schemas/Id'
        recorded_at:
          $ref: '#/components/schemas/Timestamp'
    RefundInput:
      type: object
      additionalProperties: false
      required: [amount]
      properties:
        amount:
          type: number
          format: double
          minimum: 0
          exclusiveMinimum: true
          multipleOf: 0.01
        reason:
          type: string
          maxLength: 1000

    # ------------------------------------------------------------- orders
    OrderItemInput:
      type: object
      additionalProperties: false
      required: [product_id, quantity]
      properties:
        product_id:
          $ref: '#/components/schemas/Id'
        quantity:
          type: number
          format: double
          minimum: 0
          exclusiveMinimum: true
          description: Decimal, because weight-based sales exist (§3.4).
    GiftDetailInput:
      type: object
      additionalProperties: false
      required: [wrapping_type, hide_sender]
      description: |
        `regular` gift: recipient name, phone, zone and address are **required**, and the fee uses the recipient zone.
        `shipping` gift: these must be omitted, because the shipping recipient applies (§7).
      properties:
        recipient_name:
          type: string
          maxLength: 100
        recipient_phone:
          $ref: '#/components/schemas/PhoneNumber'
        recipient_delivery_zone_id:
          $ref: '#/components/schemas/Id'
        recipient_address:
          type: string
          maxLength: 500
        wrapping_type:
          type: string
          minLength: 1
          maxLength: 100
          description: Options list open (M-10).
        card_message:
          type: string
          maxLength: 1000
        sender_name:
          type: string
          maxLength: 100
        hide_sender:
          type: boolean
    ShippingDetailInput:
      type: object
      additionalProperties: false
      required: [shipping_country_id, recipient_city, recipient_name, recipient_phone, recipient_address]
      properties:
        shipping_country_id:
          $ref: '#/components/schemas/Id'
        recipient_city:
          type: string
          minLength: 1
          maxLength: 100
        recipient_name:
          type: string
          minLength: 1
          maxLength: 100
        recipient_phone:
          $ref: '#/components/schemas/PhoneNumber'
        recipient_address:
          type: string
          minLength: 1
          maxLength: 500
        preferred_send_date:
          type: string
          format: date
        shipping_notes:
          type: string
          maxLength: 1000
    EventDetailInput:
      type: object
      additionalProperties: false
      required: [event_type, event_date, event_time, guests_count, delivery_zone_id, event_address, contact_phone]
      properties:
        event_type:
          $ref: '#/components/schemas/EventType'
        event_date:
          type: string
          format: date
          description: ≥ today + the longest lead time of the items (§5, §8).
        event_time:
          $ref: '#/components/schemas/TimeOfDay'
        guests_count:
          type: integer
          minimum: 1
        delivery_zone_id:
          $ref: '#/components/schemas/Id'
        event_address:
          type: string
          minLength: 1
          maxLength: 500
        contact_phone:
          $ref: '#/components/schemas/PhoneNumber'
        special_notes:
          type: string
          maxLength: 1000
    CheckoutRequest:
      type: object
      required: [order_type, items]
      description: |
        Cart contents sent at checkout. Conditional rules, validated with `422`:
        - `regular`: `address_id` is required unless `is_gift`. `payment_method_id` is required on order creation.
          A scheduled order requires `delivery_date` and `delivery_period_id`.
        - `shipping`: `shipping` is required. `address_id`, delivery fields and `payment_method_id` are rejected.
        - `event`: `event` is required. `is_gift` must be false. `address_id`, delivery fields and `payment_method_id` are rejected.
        - `is_gift = true` ⇒ `gift` is required.
      properties:
        order_type:
          $ref: '#/components/schemas/OrderType'
        items:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: '#/components/schemas/OrderItemInput'
        address_id:
          $ref: '#/components/schemas/Id'
        delivery_date:
          type: string
          format: date
        delivery_period_id:
          $ref: '#/components/schemas/Id'
        is_gift:
          type: boolean
          default: false
        gift:
          $ref: '#/components/schemas/GiftDetailInput'
        shipping:
          $ref: '#/components/schemas/ShippingDetailInput'
        event:
          $ref: '#/components/schemas/EventDetailInput'
        customer_notes:
          type: string
          maxLength: 1000
    CreateOrderRequest:
      allOf:
        - $ref: '#/components/schemas/CheckoutRequest'
        - type: object
          properties:
            payment_method_id:
              allOf:
                - $ref: '#/components/schemas/Id'
              description: Regular orders only (cash or electronic).
            payment_transaction_id:
              allOf:
                - $ref: '#/components/schemas/Id'
              description: Required when the regular order's method is electronic. The transaction must be `succeeded`, unlinked, and its amount must equal the recomputed total.
            expected_total_amount:
              allOf:
                - $ref: '#/components/schemas/Money'
              description: The total the customer accepted. A mismatch returns `409 PRICE_CHANGED` (§5).
          required: [expected_total_amount]
    OrderPreviewItem:
      type: object
      required: [product_id, name, quantity, unit_price, line_total]
      properties:
        product_id:
          $ref: '#/components/schemas/Id'
        name:
          type: string
        quantity:
          type: number
          format: double
        unit_price:
          $ref: '#/components/schemas/Money'
        line_total:
          $ref: '#/components/schemas/Money'
    OrderPreview:
      type: object
      required: [order_type, grandma, is_scheduled, scheduling_required, items, subtotal, fee_amount, total_amount]
      properties:
        order_type:
          $ref: '#/components/schemas/OrderType'
        grandma:
          $ref: '#/components/schemas/GrandmaRef'
        is_scheduled:
          type: boolean
        scheduling_required:
          type: boolean
          description: True when an item is made to order.
        delivery_date:
          type: string
          format: date
          nullable: true
        delivery_period:
          allOf:
            - $ref: '#/components/schemas/DeliveryPeriod'
          nullable: true
        prepare_start_date:
          type: string
          format: date
          nullable: true
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderPreviewItem'
        subtotal:
          $ref: '#/components/schemas/Money'
        fee_amount:
          $ref: '#/components/schemas/Money'
        total_amount:
          $ref: '#/components/schemas/Money'
    PriceChangedErrorResponse:
      allOf:
        - $ref: '#/components/schemas/ErrorResponse'
        - type: object
          properties:
            preview:
              allOf:
                - $ref: '#/components/schemas/OrderPreview'
              description: Present when `error.code = PRICE_CHANGED`.
    OrderItem:
      type: object
      required: [id, product_id, product_name, quantity, unit_price]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        product_id:
          $ref: '#/components/schemas/Id'
        product_name:
          type: string
        quantity:
          type: number
          format: double
        unit_price:
          allOf:
            - $ref: '#/components/schemas/Money'
          description: Price snapshot at order time.
        review:
          allOf:
            - $ref: '#/components/schemas/Review'
          nullable: true
    OrderShippingDetail:
      type: object
      required: [shipping_country, recipient_city, recipient_name, recipient_phone, recipient_address]
      properties:
        shipping_country:
          $ref: '#/components/schemas/ShippingCountry'
        recipient_city:
          type: string
        recipient_name:
          type: string
        recipient_phone:
          $ref: '#/components/schemas/PhoneNumber'
        recipient_address:
          type: string
        preferred_send_date:
          type: string
          format: date
          nullable: true
        shipping_notes:
          type: string
          nullable: true
        shipping_company:
          allOf:
            - $ref: '#/components/schemas/ShippingCompany'
          nullable: true
        tracking_number:
          type: string
          nullable: true
    ShipmentInput:
      type: object
      additionalProperties: false
      required: [shipping_company_id, tracking_number]
      properties:
        shipping_company_id:
          $ref: '#/components/schemas/Id'
        tracking_number:
          type: string
          minLength: 1
          maxLength: 100
    OrderEventDetail:
      type: object
      required: [event_type, event_date, event_time, guests_count, delivery_zone, event_address, contact_phone]
      properties:
        event_type:
          $ref: '#/components/schemas/EventType'
        event_date:
          type: string
          format: date
        event_time:
          $ref: '#/components/schemas/TimeOfDay'
        guests_count:
          type: integer
        delivery_zone:
          $ref: '#/components/schemas/DeliveryZone'
        event_address:
          type: string
        contact_phone:
          $ref: '#/components/schemas/PhoneNumber'
        special_notes:
          type: string
          nullable: true
    OrderGiftDetail:
      type: object
      required: [wrapping_type, hide_sender]
      properties:
        recipient_name:
          type: string
          nullable: true
        recipient_phone:
          allOf:
            - $ref: '#/components/schemas/PhoneNumber'
          nullable: true
        recipient_delivery_zone:
          allOf:
            - $ref: '#/components/schemas/DeliveryZone'
          nullable: true
        recipient_address:
          type: string
          nullable: true
        wrapping_type:
          type: string
        card_message:
          type: string
          nullable: true
        sender_name:
          type: string
          nullable: true
        hide_sender:
          type: boolean
    OrderStatusHistory:
      type: object
      required: [id, status, changed_at]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        status:
          $ref: '#/components/schemas/OrderStatus'
        changed_by:
          allOf:
            - $ref: '#/components/schemas/Id'
          nullable: true
          description: Null = system (e.g. payment timeout).
        changed_at:
          $ref: '#/components/schemas/Timestamp'
        note:
          type: string
          nullable: true
    OrderStatusUpdateRequest:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [preparing, ready, out_for_delivery, shipped, in_transit, delivered]
        note:
          type: string
          maxLength: 1000
    OrderNoteUpdate:
      type: object
      additionalProperties: false
      required: [delivery_responsible_note]
      properties:
        delivery_responsible_note:
          type: string
          nullable: true
          maxLength: 500
    OrderSummary:
      type: object
      required: [id, order_type, is_scheduled, is_gift, status, payment_status, total_amount, grandma, created_at, updated_at]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        order_type:
          $ref: '#/components/schemas/OrderType'
        is_scheduled:
          type: boolean
        is_gift:
          type: boolean
        status:
          $ref: '#/components/schemas/OrderStatus'
        payment_status:
          $ref: '#/components/schemas/PaymentStatus'
        total_amount:
          $ref: '#/components/schemas/Money'
        grandma:
          $ref: '#/components/schemas/GrandmaRef'
        customer:
          allOf:
            - $ref: '#/components/schemas/User'
          description: Admin views only.
        delivery_date:
          type: string
          format: date
