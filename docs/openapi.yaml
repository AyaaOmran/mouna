  /admin/reports/grandma-dues:
    get:
      tags: [Admin - Reports]
      summary: Grandma dues report (manual settlement)
      description: |
        Per grandma for the period (§11.12, ERD v2):
        - Orders: sum of `Order.subtotal` of **delivered** orders. Fees are excluded.
        - Subscriptions: `Subscription.subtotal ÷ deliveries_count` for each delivery delivered in the period. Fees are excluded (C-02 resolved).
        - `platform_share` = value × `commission_rate` / 100; `grandma_due` = value − `platform_share`.
        Uses the current commission rate, because no history is kept (A-11). Report only, with no payouts.
      operationId: adminGrandmaDuesReport
      x-required-permission: reports
      parameters:
        - $ref: '#/components/parameters/ReportDateFrom'
        - $ref: '#/components/parameters/ReportDateTo'
        - name: grandma_id
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/Id'
      responses:
        '200':
          description: Report.
          content:
