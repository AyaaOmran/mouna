          description: Rejected.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/InvalidTransition'
        '422':
          $ref: '#/components/responses/ValidationError'
  /admin/orders/{orderId}/status:
    parameters:
      - $ref: '#/components/parameters/OrderId'
    post:
      tags: [Admin - Orders]
      summary: Advance the preparation or delivery status
      description: |
        Allowed paths (§10.2):
        - regular / scheduled / event: confirmed → preparing → ready → out_for_delivery → delivered
        - shipping: confirmed → preparing → shipped → in_transit → delivered
        Scheduled orders stay `confirmed` until `prepare_start_date`. The admin then moves them on manually (§4).
        `shipped` requires the shipment to be recorded first. Every change adds a history row and sends notification
        `order_status_changed`.
      operationId: adminUpdateOrderStatus
      x-required-permission: orders
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderStatusUpdateRequest'
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/InvalidTransition'
        '422':
          $ref: '#/components/responses/ValidationError'
  /admin/orders/{orderId}/shipment:
