          items:
            type: object
            required: [order_type, grandma, orders_count, subtotal, fees, total]
            properties:
              order_type:
                $ref: '#/components/schemas/OrderType'
              grandma:
                $ref: '#/components/schemas/GrandmaRef'
              orders_count:
                type: integer
              subtotal:
                $ref: '#/components/schemas/Money'
              fees:
                $ref: '#/components/schemas/Money'
              total:
                $ref: '#/components/schemas/Money'
    SubscriptionsReport:
      type: object
      required: [date_from, date_to, active_count, completed_count, delivered_deliveries_count]
      properties:
        date_from:
          type: string
          format: date
        date_to:
          type: string
          format: date
        active_count:
          type: integer
        completed_count:
          type: integer
        delivered_deliveries_count:
          type: integer
    GrandmaDuesReport:
      type: object
      required: [date_from, date_to, commission_rate, rows]
      properties:
        date_from:
          type: string
          format: date
        date_to:
          type: string
          format: date
        commission_rate:
          type: number
          format: double
        rows:
          type: array
          items:
            type: object
            required: [grandma, orders_value, subscriptions_value, total_value, platform_share, grandma_due]
            properties:
              grandma:
                $ref: '#/components/schemas/GrandmaRef'
              orders_value:
                allOf:
                  - $ref: '#/components/schemas/Money'
                description: Σ Order.subtotal of delivered orders.
              subscriptions_value:
                allOf:
                  - $ref: '#/components/schemas/Money'
                description: Σ (Subscription.subtotal ÷ deliveries_count) per delivered delivery.
              total_value:
                $ref: '#/components/schemas/Money'
              platform_share:
                $ref: '#/components/schemas/Money'
              grandma_due:
                $ref: '#/components/schemas/Money'
