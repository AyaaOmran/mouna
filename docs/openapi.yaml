                  nullable: true
                order_hours_from:
                  allOf:
                    - $ref: '#/components/schemas/TimeOfDay'
                  nullable: true
                order_hours_to:
                  allOf:
                    - $ref: '#/components/schemas/TimeOfDay'
                  nullable: true
    Review:
